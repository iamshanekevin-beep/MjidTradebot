services:
  bot:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt && python dashboard.py"
    restart: unless-stopped
